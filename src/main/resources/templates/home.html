<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="#{home.title}">Zelora – Sustainable Fashion</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        body {
            padding-top: 70px;
            background: #fafafa;
        }

        /* HERO */
        .hero-section {
            height: 550px;
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-shadow: 0 1px 10px rgba(0,0,0,0.8);
            border-radius: 12px;
        }

        .hero-section-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translateY(80px);
        }

        .hero-buttons button {
            margin-top: 8px;
            padding: 12px 22px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
        }

        /* CATEGORY CARDS */
        .category-card {
            padding: 18px;
            background: white;
            border-radius: 8px;
            transition: 0.2s ease;
        }
        .category-card:hover {
            transform: translateY(-5px);
        }

        /* PRODUCT CARDS */
        .product-card img {
            height: 180px;
            width: 100%;
            object-fit: cover;
            border-radius: 6px;
        }

        .red-line-through {
            color: #000;
            text-decoration: line-through;
            text-decoration-color: red;
            text-decoration-thickness: 2px;
        }

        /* FOOTER */
        .footer {
            background: #222 !important;
            color: #ddd;
            border-top: 1px solid #444;
        }
        .footer-brand {
            font-size: 1.6rem;
            font-weight: bold;
            color: #fff;
        }
        .footer-link {
            color: #ccc;
            text-decoration: none;
        }
        .footer-link:hover {
            color: #fff;
        }
    </style>

</head>

<body>

<!--navbar-->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top px-5">
    <div class="w-100 d-flex justify-content-between align-items-center">
        <a class="navbar-brand fw-bold fs-3" href="/">Zelora</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse w-100" id="navbarNav">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link active fw-semibold" href="/" th:text="#{nav.home}">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/products" th:text="#{nav.browse}">Browse Products</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/products/search" th:text="#{nav.search}">Search</a>
                </li>

                <li class="nav-item dropdown ms-3">
                    <a class="nav-link dropdown-toggle" href="#" id="langDropdown"
                       role="button" data-bs-toggle="dropdown" aria-expanded="false"
                       th:text="#{nav.language}">
                        Language
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="langDropdown">
                        <li><a class="dropdown-item" href="?lang=en_IE">English (IE)</a></li>
                        <li><a class="dropdown-item" href="?lang=fr_FR">Français</a></li>
                    </ul>
                </li>


            </ul>
        </div>
    </div>
</nav>



<div class="container-fluid px-5 mt-4">
    <div class="hero-section"
         th:style="'background-image: url(/assets/images/hero/hero.jpg)'">

        <div class="hero-section-content">
            <h1 class="display-3 fw-bold mb-4">Zelora</h1>

            <div class="hero-buttons d-flex gap-3">
                <a href="/products"><button class="btn btn-light px-4 py-2" th:text="#{hero.browse}">Browse Products</button></a>
                <a href="/products/search"><button class="btn btn-light px-4 py-2" th:text="#{hero.search}">Search Items</button></a>
            </div>
        </div>

    </div>
</div>



<div class="container-fluid px-5 mt-5">
    <h2 class="mb-4 text-center" th:text="#{home.categories}">Shop by Category</h2>

    <div class="row text-center justify-content-center">

        <div class="col-6 col-md-3 mb-4"
             th:each="cat : ${categories}">
            <a th:href="@{'/products/search'(category=${cat.categoryName})}"
               style="text-decoration:none; color:inherit;">
                <div class="category-card shadow-sm">
                    <h5 class="mt-2" th:text="${cat.categoryName}"></h5>
                </div>
            </a>
        </div>

    </div>
</div>


<!-- featured products-->
<div class="container-fluid px-5 mt-5">
    <h2 class="mb-4 text-center" th:text="#{home.featured}">Featured Products</h2>

    <div class="row justify-content-center" th:if="${featuredProducts}">
        <div class="col-md-4 mb-4" th:each="p : ${featuredProducts}">
            <div class="card shadow-sm product-card">

                <img th:src="@{/assets/images/thumbs/{id}/{file}(id=${p.productId}, file=${p.featureImage})}"
                     class="card-img-top"
                     alt="thumbnail">

                <div class="card-body text-center">
                    <h5 class="card-title" th:text="${p.productName}"></h5>

                    <p class="card-text">
                        <span class="h5 text-dark"
                              th:if="${p.discountedPrice != null && p.discountedPrice < p.price}"
                              th:text="'€' + ${p.discountedPrice}"></span>

                        <span class="h5 text-dark"
                              th:if="${p.discountedPrice == null || p.discountedPrice >= p.price}"
                              th:text="'€' + ${p.price}"></span>

                        <span class="h6 red-line-through ms-2"
                              th:if="${p.discountedPrice != null && p.discountedPrice < p.price}"
                              th:text="'€' + ${p.price}"></span>
                    </p>

                    <a th:href="@{'/products/' + ${p.productId}}">
                        <button class="btn btn-outline-primary" th:text="#{product.details}">
                            View Details
                        </button>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>


<!-- shop now-->
<div class="text-center mt-5">
    <a href="/products">
        <button class="btn btn-dark btn-lg" th:text="#{home.shopNow}">Shop Now!</button>
    </a>
</div>


<!-- footer-->
<footer class="footer mt-5 py-4 w-100">
    <div class="text-center">
        <p class="footer-brand mb-2">Zelora</p>

        <div class="footer-links mb-3">
            <a href="/contact" class="footer-link mx-2" th:text="#{footer.contact}">Contact Us</a>
            <a href="/about" class="footer-link mx-2" th:text="#{footer.about}">About Us</a>
            <a href="/find-us" class="footer-link mx-2" th:text="#{footer.find}">Find Us</a>
            <a href="/products" class="footer-link mx-2" th:text="#{footer.shop}">Shop</a>
        </div>

        <p class="small mb-0" style="color:#ccc;" th:text="#{footer.rights}">
            © 2025 Zelora — All Rights Reserved.
        </p>
    </div>
</footer>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</html>
