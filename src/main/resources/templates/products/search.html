<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">

  <title th:text="#{search.title}">Zelora – Product Search</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css"/>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.5.1.js"></script>

  <!-- DataTables JS -->
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

  <style>
    body {
      background: #fafafa;
      padding-top: 70px;
    }
    .navbar {
      background: #ffffff !important;
      border-bottom: 1px solid #e5e5e5;
      padding-top: 8px;
      padding-bottom: 8px;
    }
    .mini-hero {
      background-image: url('/assets/images/hero/hero.jpg');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      height: 400px;
      border-radius: 12px;
      margin-bottom: 40px;
      width: 100%;
    }
    .product-name-trigger {
      cursor: pointer;
      font-weight: 600;
      color: #000 !important;
      text-decoration: none;
    }
    .product-name-trigger:hover {
      color: #333 !important;
    }
    .footer {
      background: #222;
      color: #ddd;
      border-top: 1px solid #444;
    }
    .footer-brand {
      font-size: 1.6rem;
      font-weight: bold;
      color: #fff;
    }
    .footer-link {
      color: #ccc;
      text-decoration: none;
      font-size: 15px;
    }
    .footer-link:hover {
      color: white;
      text-decoration: underline;
    }
  </style>
</head>



<body>

<!-- nav -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
  <div class="container-fluid px-5">

    <a class="navbar-brand fw-bold fs-3" href="/">Zelora</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">

        <li class="nav-item">
          <a class="nav-link" th:text="#{nav.home}" href="/"></a>
        </li>

        <li class="nav-item">
          <a class="nav-link" th:text="#{nav.browse}" href="/products"></a>
        </li>

        <li class="nav-item">
          <a class="nav-link fw-semibold" th:text="#{nav.search}" href="/products/search"></a>
        </li>

        <!-- LANGUAGE SELECTOR -->
        <li class="nav-item dropdown ms-3">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
             th:text="#{nav.language}"></a>

          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="?lang=en_IE">English (Ireland)</a></li>
            <li><a class="dropdown-item" href="?lang=fr_FR">Français</a></li>
          </ul>
        </li>

      </ul>
    </div>

  </div>
</nav>


<div class="container-fluid px-5 mt-3">
  <div class="mini-hero"></div>
</div>

<div class="container-fluid px-5">


  <form th:action="@{/products/search}" method="get" th:object="${form}" class="row g-3 mb-4">

    <div class="col-md-3">
      <label class="form-label" th:text="#{search.name}">Name</label>
      <input type="text" th:field="*{name}" class="form-control"
             th:placeholder="#{search.placeholder.name}">
    </div>

    <div class="col-md-3">
      <label class="form-label" th:text="#{search.category}"></label>
      <select th:field="*{category}" class="form-select">
        <option value="" th:text="#{search.allCategories}"></option>
        <option th:each="c : ${categories}" th:value="${c.categoryName}" th:text="${c.categoryName}"></option>
      </select>
    </div>

    <div class="col-md-3">
      <label class="form-label" th:text="#{search.minPrice}"></label>
      <input type="number" step="0.01" th:field="*{minPrice}" class="form-control">
    </div>

    <div class="col-md-3">
      <label class="form-label" th:text="#{search.maxPrice}"></label>
      <input type="number" step="0.01" th:field="*{maxPrice}" class="form-control">
    </div>

    <div class="col-md-6">
      <label class="form-label" th:text="#{search.keyword}"></label>
      <input type="text" th:field="*{productDesc}" class="form-control"
             th:placeholder="#{search.placeholder.keyword}">
    </div>

    <div class="col-md-2 d-flex align-items-end">
      <div class="form-check mt-4">
        <input type="checkbox" th:field="*{recent}" class="form-check-input" id="recentCheckbox">
        <label class="form-check-label" for="recentCheckbox" th:text="#{search.recent}"></label>
      </div>
    </div>

    <div class="col-md-2 d-flex align-items-end">
      <button type="submit" class="btn btn-dark w-100 mt-4" th:text="#{search.button}"></button>
    </div>

    <div class="col-md-2 d-flex align-items-end">
      <a th:href="@{/products}" class="btn btn-outline-secondary w-100 mt-4"
         th:text="#{search.clear}"></a>
    </div>

  </form>

  <hr/>


  <h3 class="mb-3" th:text="#{search.results}"></h3>

  <table id="productTable" class="table table-striped table-hover align-middle">
    <thead class="table-dark">
    <tr>
      <th th:text="#{search.col.product}"></th>
      <th th:text="#{search.col.name}"></th>
      <th th:text="#{search.col.category}"></th>
      <th th:text="#{search.col.price}"></th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="p : ${products}">
      <td>
        <span class="product-modal-trigger"
              style="cursor:pointer;"
              th:data-id="${p.productId}"
              th:data-name="${p.productName}"
              th:data-category="${p.categoryId != null ? p.categoryId.categoryName : 'N/A'}"
              th:data-price="${p.price}"
              th:data-desc="${p.description}">
          <img th:src="@{/assets/images/thumbs/{id}/{file}(id=${p.productId}, file=${p.featureImage})}"
               class="img-thumbnail"
               style="width:70px;height:70px;object-fit:cover;">
        </span>
      </td>

      <td>
        <span class="product-modal-trigger product-name-trigger"
              th:data-id="${p.productId}"
              th:data-name="${p.productName}"
              th:data-category="${p.categoryId != null ? p.categoryId.categoryName : 'N/A'}"
              th:data-price="${p.price}"
              th:data-desc="${p.description}"
              th:text="${p.productName}">
        </span>
      </td>

      <td th:text="${p.categoryId != null ? p.categoryId.categoryName : 'N/A'}"></td>

      <td th:text="${p.price}"></td>
    </tr>
    </tbody>

  </table>
<!--  modal-->
  <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title" id="modalName"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <div class="row">

            <!-- left main Image -->
            <div class="col-md-6">
              <img id="mainImage" class="img-fluid rounded mb-3" src="" alt="">
              <div id="thumbContainer" class="d-flex gap-2"></div>
            </div>

            <!-- right side-->
            <div class="col-md-6">

              <p>
                <strong th:text="#{product.category}">Category:</strong>
                <span id="modalCategory"></span>
              </p>

              <p>
                <strong th:text="#{product.price}">Price:</strong>
                €<span id="modalPrice"></span>
              </p>

              <p>
                <strong th:text="#{product.description}">Description:</strong>
              </p>
              <p id="modalDescription"></p>

              <div class="text-center">
                <a id="fullDetailsLink" href="#" class="btn btn-dark mt-2">
                  <span th:text="#{product.viewFull}">View Full Details</span>
                </a>
              </div>

            </div>

          </div>
        </div>

      </div>
    </div>
  </div>


</div>

<footer class="footer mt-5 py-4">
  <div class="container-fluid text-center">
    <p class="footer-brand mb-2">Zelora</p>

    <div class="footer-links mb-3">
      <a href="/contact" class="footer-link mx-2" th:text="#{footer.contact}"></a>
      <a href="/about" class="footer-link mx-2" th:text="#{footer.about}"></a>
      <a href="/find-us" class="footer-link mx-2" th:text="#{footer.find}"></a>
      <a href="/products" class="footer-link mx-2" th:text="#{footer.shop}"></a>
    </div>

    <p class="small mb-0" style="color:#ccc;" th:text="#{footer.rights}">
      © 2025 Zelora — All Rights Reserved.
    </p>
  </div>
</footer>
<!--Bootstrap JS-->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  $(document).ready(function () {
    $('#productTable').DataTable();
  });

  function buildImageUrls(productId) {
    const basePath = `/assets/images/large/${productId}`;
    const urls = [];

    for (let i = 1; i <= 4; i++) {
      urls.push(`${basePath}/${productId}_${i}.png`);
    }

    urls.push(`${basePath}/no-image.png`);

    return urls;
  }


  const modalElement = document.getElementById('productModal');
  const modal = new bootstrap.Modal(modalElement);

  const mainImage = document.getElementById('mainImage');
  const thumbContainer = document.getElementById('thumbContainer');
  const modalName = document.getElementById('modalName');
  const modalCategory = document.getElementById('modalCategory');
  const modalPrice = document.getElementById('modalPrice');
  const modalDescription = document.getElementById('modalDescription');
  const fullDetailsLink = document.getElementById('fullDetailsLink');

  document.addEventListener('click', function(e) {
    const trigger = e.target.closest('.product-modal-trigger');
    if (!trigger) return;

    const id = trigger.dataset.id;
    const name = trigger.dataset.name;
    const category = trigger.dataset.category;
    const price = trigger.dataset.price;
    const desc = trigger.dataset.desc || 'No description available.';

    modalName.textContent = name;
    modalCategory.textContent = category;
    modalPrice.textContent = price;
    modalDescription.textContent = desc;

    fullDetailsLink.href = `/products/${id}`;

    thumbContainer.innerHTML = '';

    const urls = buildImageUrls(id);
    let mainSet = false;

    urls.forEach(url => {
      const thumb = document.createElement('img');
      thumb.src = url;
      thumb.className = 'img-thumbnail';
      thumb.style.width = '70px';
      thumb.style.height = '70px';
      thumb.style.objectFit = 'cover';
      thumb.style.cursor = 'pointer';

      thumb.addEventListener('error', () => thumb.remove());
      thumb.addEventListener('click', () => mainImage.src = url);

      thumb.addEventListener('load', () => {
        if (!mainSet) {
          mainImage.src = url;
          mainSet = true;
        }
      });

      thumbContainer.appendChild(thumb);
    });

    setTimeout(() => {
      if (!mainSet) {
        mainImage.src = '/assets/images/large/no-image.png';
      }
    }, 500);

    modal.show();
  });
</script>

</body>
</html>
