<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Zelora - Product Search</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- DataTables -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">

  <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

  <style>
    .thumb-img {
      width: 70px;
      height: auto;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    .search-container {
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
  </style>
</head>

<body class="bg-light">

<div class="container mt-4">

  <h2 class="mb-4 fw-bold">Product Search</h2>

  <!-- SEARCH FORM -->
  <div class="search-container mb-4">

    <form th:action="@{/products/search}" method="get" th:object="${form}" class="row g-3">

      <!-- Name -->
      <div class="col-md-4">
        <label class="form-label">Name</label>
        <input th:field="*{name}" class="form-control" placeholder="Product name">
      </div>

      <!-- Category -->
      <div class="col-md-4">
        <label class="form-label">Category</label>
        <select th:field="*{category}" class="form-select">
          <option value="">-- All Categories --</option>
          <option th:each="c : ${categories}"
                  th:value="${c.categoryName}"
                  th:text="${c.categoryName}"></option>
        </select>
      </div>

      <!-- Min Price -->
      <div class="col-md-2">
        <label class="form-label">Min Price</label>
        <input type="number" step="0.01" th:field="*{minPrice}" class="form-control">
      </div>

      <!-- Max Price -->
      <div class="col-md-2">
        <label class="form-label">Max Price</label>
        <input type="number" step="0.01" th:field="*{maxPrice}" class="form-control">
      </div>

      <!-- Description keyword -->
      <div class="col-md-8">
        <label class="form-label">Description contains</label>
        <input th:field="*{productDesc}" class="form-control" placeholder="e.g. organic, cotton, jacket">
      </div>

      <!-- Recent checkbox -->
      <div class="col-md-2 d-flex align-items-center">
        <div class="form-check mt-4">
          <input type="checkbox" th:field="*{recent}" class="form-check-input">
          <label class="form-check-label">Recent (last 7 days)</label>
        </div>
      </div>

      <!-- Buttons -->
      <div class="col-md-2 d-flex align-items-end">
        <button type="submit" class="btn btn-primary w-100">Search</button>
      </div>

      <div class="col-md-2 d-flex align-items-end">
        <a href="/products" class="btn btn-secondary w-100">Clear Filters</a>
      </div>

    </form>
  </div>

  <hr />

  <!-- RESULTS -->
  <h3 class="mt-4 fw-semibold">Product Results</h3>

  <table id="productTable" class="table table-striped table-bordered mt-3">
    <thead class="table-dark">
    <tr>
      <th>Thumb</th>
      <th>Name</th>
      <th>Category</th>
      <th>Price (€)</th>
      <th>Release Date</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="p : ${products}">
      <!-- Thumbnail -->
      <td>
        <img th:src="@{'/assets/images/thumbs/' + ${p.productId} + '/' + ${p.featureImage}}"
             class="thumb-img">
      </td>

      <!-- Product name clickable link -->
      <td>
        <a th:href="@{'/products/' + ${p.productId}}"
           th:text="${p.productName}"
           class="text-decoration-none fw-semibold"></a>
      </td>

      <td th:text="${p.categoryId.categoryName}"></td>
      <td th:text="${p.price}"></td>
      <td th:text="${p.releaseDate}"></td>
    </tr>
    </tbody>
  </table>

</div>

<script>
  $(document).ready(function () {
    $('#productTable').DataTable();
  });
</script>

</body>
</html>
