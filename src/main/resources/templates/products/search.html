<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Zelora – Product Search</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css"/>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.5.1.js"></script>

  <!-- DataTables JS -->
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

  <style>
    body {
      background: #fafafa;
      padding-top: 70px;
    }

    /* NAVBAR */
    .navbar {
      background: #ffffff !important;
      border-bottom: 1px solid #e5e5e5;
      padding-top: 8px;
      padding-bottom: 8px;
    }

    /* RESTORED FULL-WIDTH HERO */
    .mini-hero {
      background-image: url('/assets/images/hero/hero.jpg');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      height: 400px;
      border-radius: 12px;
      margin-bottom: 40px;
      width: 100%;
    }

    /* PRODUCT NAME LINK STYLE */
    .product-name-trigger {

      cursor: pointer;
      font-weight: 600;
      color: #000 !important;
      text-decoration: none;
    }

    .product-name-trigger:hover {
      color: #333 !important;
    }

    /* FOOTER */
    .footer {
      background: #222;
      color: #ddd;
      border-top: 1px solid #444;
    }

    .footer-brand {
      font-size: 1.6rem;
      font-weight: bold;
      color: #fff;
    }

    .footer-link {
      color: #ccc;
      text-decoration: none;
      font-size: 15px;
    }

    .footer-link:hover {
      color: white;
      text-decoration: underline;
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
  <div class="container-fluid px-5">

    <a class="navbar-brand fw-bold fs-3" href="/">Zelora</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">

        <li class="nav-item">
          <a class="nav-link"
             th:classappend="${activePage == 'home'} ? 'active fw-semibold' : ''"
             href="/">Home</a>
        </li>

        <li class="nav-item">
          <a class="nav-link"
             th:classappend="${activePage == 'browse'} ? 'active fw-semibold' : ''"
             href="/products">Browse Products</a>
        </li>

        <li class="nav-item">
          <a class="nav-link"
             th:classappend="${activePage == 'search'} ? 'active fw-semibold' : ''"
             href="/products/search">Search</a>
        </li>

      </ul>
    </div>

  </div>
</nav>

<!-- FULL WIDTH HERO -->
<div class="container-fluid px-5 mt-3">
  <div class="mini-hero"></div>
</div>

<!-- MAIN CONTENT -->
<div class="container-fluid px-5">

  <!-- SEARCH FORM -->
  <form th:action="@{/products/search}" method="get" th:object="${form}" class="row g-3 mb-4">

    <div class="col-md-3">
      <label class="form-label">Name</label>
      <input type="text" th:field="*{name}" class="form-control" placeholder="Product name">
    </div>

    <div class="col-md-3">
      <label class="form-label">Category</label>
      <select th:field="*{category}" class="form-select">
        <option value="">-- All Categories --</option>
        <option th:each="c : ${categories}" th:value="${c.categoryName}" th:text="${c.categoryName}"></option>
      </select>
    </div>

    <div class="col-md-3">
      <label class="form-label">Min Price (€)</label>
      <input type="number" step="0.01" th:field="*{minPrice}" class="form-control">
    </div>

    <div class="col-md-3">
      <label class="form-label">Max Price (€)</label>
      <input type="number" step="0.01" th:field="*{maxPrice}" class="form-control">
    </div>

    <div class="col-md-6">
      <label class="form-label">Description Keyword</label>
      <input type="text" th:field="*{productDesc}" class="form-control" placeholder="Search description">
    </div>

    <div class="col-md-2 d-flex align-items-end">
      <div class="form-check mt-4">
        <input type="checkbox" th:field="*{recent}" class="form-check-input" id="recentCheckbox">
        <label class="form-check-label" for="recentCheckbox">Recent</label>
      </div>
    </div>

    <div class="col-md-2 d-flex align-items-end">
      <button type="submit" class="btn btn-dark w-100 mt-4">Search</button>
    </div>

    <div class="col-md-2 d-flex align-items-end">
      <a th:href="@{/products}" class="btn btn-outline-secondary w-100 mt-4">Clear</a>
    </div>

  </form>

  <hr/>

  <!-- RESULTS -->
  <h3 class="mb-3">Product Results</h3>

  <table id="productTable" class="table table-striped table-hover align-middle">
    <thead class="table-dark">
    <tr>
      <th>Product</th>
      <th>Name</th>
      <th>Category</th>
      <th>Price (€)</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="p : ${products}">

      <!-- IMAGE -->
      <td>
                <span class="product-modal-trigger"
                      style="cursor:pointer;"
                      th:data-id="${p.productId}"
                      th:data-name="${p.productName}"
                      th:data-category="${p.categoryId != null ? p.categoryId.categoryName : 'N/A'}"
                      th:data-price="${p.price}"
                      th:data-desc="${p.description}">
                  <img th:src="@{/assets/images/thumbs/{id}/{file}(id=${p.productId}, file=${p.featureImage})}"
                       alt="thumb"
                       class="img-thumbnail"
                       style="width:70px;height:70px;object-fit:cover;">
                </span>
      </td>

      <!-- NAME -->
      <td>
                <span class="product-modal-trigger product-name-trigger"
                      th:data-id="${p.productId}"
                      th:data-name="${p.productName}"
                      th:data-category="${p.categoryId != null ? p.categoryId.categoryName : 'N/A'}"
                      th:data-price="${p.price}"
                      th:data-desc="${p.description}"
                      th:text="${p.productName}">
                </span>
      </td>

      <!-- CATEGORY -->
      <td th:text="${p.categoryId != null ? p.categoryId.categoryName : 'N/A'}"></td>

      <!-- PRICE -->
      <td th:text="${p.price}"></td>

    </tr>
    </tbody>

  </table>

</div>

<!-- MODAL -->
<div class="modal fade" id="productModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Product</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <div class="row">

          <div class="col-md-6">
            <img id="mainImage" class="img-fluid rounded mb-3 border"
                 style="max-height:350px;object-fit:cover;">
            <div id="thumbContainer" class="d-flex flex-wrap gap-2"></div>
          </div>

          <div class="col-md-6">
            <h4 id="modalName"></h4>
            <p class="text-muted mb-1">Category: <span id="modalCategory"></span></p>
            <p class="h4 text-success mb-3">€<span id="modalPrice"></span></p>

            <h6>Description</h6>
            <p id="modalDescription" class="small"></p>

            <div class="text-center mt-4">
              <a id="fullDetailsLink" href="#" class="btn btn-dark px-4">
                View Full Details
              </a>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>

<!-- FOOTER -->
<footer class="footer mt-5 py-4">
  <div class="container-fluid text-center">
    <p class="footer-brand mb-2">Zelora</p>

    <div class="footer-links mb-3">
      <a href="/contact" class="footer-link mx-2">Contact Us</a>
      <a href="/about" class="footer-link mx-2">About Us</a>
      <a href="/find-us" class="footer-link mx-2">Find Us</a>
      <a href="/products" class="footer-link mx-2">Shop</a>
    </div>

    <p class="small mb-0" style="color:#ccc;">
      © 2025 Zelora — All Rights Reserved.
    </p>
  </div>
</footer>

<!-- BOOTSTRAP JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


<script>
  $(document).ready(function () {
    $('#productTable').DataTable();
  });

  function buildImageUrls(productId) {
    const urls = [];
    for (let i = 1; i <= 4; i++) {
      urls.push(`/assets/images/large/${productId}/${productId}_${i}.png`);
    }
    return urls;
  }

  const modalElement = document.getElementById('productModal');
  const modal = new bootstrap.Modal(modalElement);

  const mainImage = document.getElementById('mainImage');
  const thumbContainer = document.getElementById('thumbContainer');
  const modalName = document.getElementById('modalName');
  const modalCategory = document.getElementById('modalCategory');
  const modalPrice = document.getElementById('modalPrice');
  const modalDescription = document.getElementById('modalDescription');
  const fullDetailsLink = document.getElementById('fullDetailsLink');

  document.addEventListener('click', function(e) {
    const trigger = e.target.closest('.product-modal-trigger');
    if (!trigger) return;

    const id = trigger.dataset.id;
    const name = trigger.dataset.name;
    const category = trigger.dataset.category;
    const price = trigger.dataset.price;
    const desc = trigger.dataset.desc || 'No description available.';

    modalName.textContent = name;
    modalCategory.textContent = category;
    modalPrice.textContent = price;
    modalDescription.textContent = desc;

    fullDetailsLink.href = `/products/${id}`;

    thumbContainer.innerHTML = '';

    const urls = buildImageUrls(id);
    let mainSet = false;

    urls.forEach(url => {
      const thumb = document.createElement('img');
      thumb.src = url;
      thumb.className = 'img-thumbnail';
      thumb.style.width = '70px';
      thumb.style.height = '70px';
      thumb.style.objectFit = 'cover';
      thumb.style.cursor = 'pointer';

      thumb.addEventListener('error', () => thumb.remove());
      thumb.addEventListener('click', () => mainImage.src = url);

      thumb.addEventListener('load', () => {
        if (!mainSet) {
          mainImage.src = url;
          mainSet = true;
        }
      });

      thumbContainer.appendChild(thumb);
    });

    setTimeout(() => {
      if (!mainSet) {
        mainImage.src = '/assets/images/large/no-image.png';
      }
    }, 500);

    modal.show();
  });
</script>

</body>
</html>
