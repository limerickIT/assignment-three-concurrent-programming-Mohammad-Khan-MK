<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Products</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- DataTables -->
  <link rel="stylesheet"
        href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">

  <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
</head>

<body class="p-4">

<h2 class="mb-4">Product Search</h2>

<form th:action="@{/products/search}" method="get" th:object="${form}" class="mb-4">

  <div class="row mb-3">
    <div class="col-md-4">
      <label class="form-label">Name:</label>
      <input type="text" th:field="*{name}" class="form-control" placeholder="Product name">
    </div>

    <div class="col-md-4">
      <label class="form-label">Category:</label>
      <select th:field="*{category}" class="form-select">
        <option value="">-- All Categories --</option>
        <option th:each="c : ${categories}"
                th:value="${c.categoryName}"
                th:text="${c.categoryName}">
        </option>
      </select>
    </div>
  </div>

  <button type="submit" class="btn btn-primary">Search</button>
</form>

<hr>

<h3>Product List</h3>

<table id="productTable" class="table table-striped mt-3">
  <thead>
  <tr>
    <th>ID</th>
    <th>Name</th>
  </tr>
  </thead>

  <tbody>
  <tr th:each="p : ${products}">
    <td th:text="${p.productId}"></td>
    <td th:text="${p.productName}"></td>
  </tr>
  </tbody>
</table>

<script>
  $(document).ready(function () {
    $('#productTable').DataTable();
  });
</script>



</body>
</html>
