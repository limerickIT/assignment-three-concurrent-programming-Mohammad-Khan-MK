<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${product.productName} + ' – Zelora'">Product Details</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet"/>
    <style>
        .main-image {
            max-height: 400px;
            object-fit: cover;
        }
        .thumb-image {
            width: 80px;
            height: 80px;
            object-fit: cover;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-light">

<div class="container py-4">


    <a href="/products" class="btn btn-link mb-3">&larr; Back to Search</a>

    <div class="row">

        <div class="col-md-6 mb-3">

<!--            thumbs image-->
            <img id="mainImage"
                 class="img-fluid rounded border main-image mb-3"
                 th:src="@{'/assets/images/large/' + ${product.productId} + '/' + ${product.productId} + '_1.png'}"
                 alt="Main product image"
                 onerror="this.src='/assets/images/large/no-image.png'">

<!--            large imge-->
            <div class="d-flex flex-wrap gap-2">

                <img class="thumb-image img-thumbnail"
                     th:src="@{'/assets/images/large/' + ${product.productId} + '/' + ${product.productId} + '_1.png'}"
                     alt="thumb 1"
                     onerror="this.style.display='none'"
                     onclick="document.getElementById('mainImage').src=this.src">

                <img class="thumb-image img-thumbnail"
                     th:src="@{'/assets/images/large/' + ${product.productId} + '/' + ${product.productId} + '_2.png'}"
                     alt="thumb 2"
                     onerror="this.style.display='none'"
                     onclick="document.getElementById('mainImage').src=this.src">

                <img class="thumb-image img-thumbnail"
                     th:src="@{'/assets/images/large/' + ${product.productId} + '/' + ${product.productId} + '_3.png'}"
                     alt="thumb 3"
                     onerror="this.style.display='none'"
                     onclick="document.getElementById('mainImage').src=this.src">

                <img class="thumb-image img-thumbnail"
                     th:src="@{'/assets/images/large/' + ${product.productId} + '/' + ${product.productId} + '_4.png'}"
                     alt="thumb 4"
                     onerror="this.style.display='none'"
                     onclick="document.getElementById('mainImage').src=this.src">

            </div>
        </div>

<!--        details-->
        <div class="col-md-6 mb-3">
            <h2 th:text="${product.productName}">Product Name</h2>

            <p class="text-muted mb-1">
                Category:
                <span th:text="${product.categoryId != null ? product.categoryId.categoryName : 'N/A'}"></span>
            </p>

            <!-- Price & discounted price -->
            <div class="mb-3">
                <span class="h4 text-success me-2"
                      th:text="${product.discountedPrice != null and product.discountedPrice < product.price} ?
                               '€' + ${product.discountedPrice} :
                               '€' + ${product.price}">
                </span>

                <span class="text-muted text-decoration-line-through"
                      th:if="${product.discountedPrice != null and product.discountedPrice < product.price}"
                      th:text="'€' + ${product.price}">
                </span>
            </div>

            <h5>Description</h5>
            <p th:text="${product.description}">Product description here.</p>
        </div>
    </div>


    <hr class="my-4">

    <h4>Customer Reviews</h4>

    <p class="mb-3">
        <strong>Average Rating:</strong>
        <span th:text="${avgRating}"></span> / 5
    </p>

    <div th:if="${reviews.size() > 0}">
        <div class="card mb-3" th:each="r : ${reviews}">
            <div class="card-body">

                <h6>
                    Rating:
                    <span th:text="${r.rating}"></span> / 5
                </h6>

                <p th:text="${r.reviewText}"></p>

                <p class="text-muted small">
                    By
                    <span th:text="${r.customerId.firstName}"></span>
                    from
                    <span th:text="${r.customerId.city}"></span>
                </p>

            </div>
        </div>
    </div>

    <div th:if="${reviews.size() == 0}">
        <p class="text-muted">No reviews available.</p>
    </div>



    <hr class="my-4">

    <h4>Stock Information</h4>

    <p class="fw-bold"
       th:classappend="${available <= 0} ? 'text-danger' :
                   (${available <= product.inventoryList[0].reorderPoint} ? 'text-warning' : 'text-success')"
       th:text="${stockMessage}">
    </p>


</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
